# Public reverse proxy + TLS. Coexists with other vhosts on a shared host: it
# only manages charging's own site file and obtains its own cert.
---
- name: Install nginx + certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable + start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Render charging API rate-limit zone (http context)
  ansible.builtin.template:
    src: charging-ratelimit.conf.j2
    dest: /etc/nginx/conf.d/10-charging-ratelimit.conf
    mode: "0644"
  notify: reload nginx

- name: Does a TLS cert already exist?
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ charging_domain }}/fullchain.pem"
  register: tls_cert

# Pass 1: render the vhost. Without a cert it's HTTP-only (so the box is
# reachable and certbot --nginx can validate); with a cert it's full TLS.
- name: Render charging vhost
  ansible.builtin.template:
    src: charging.conf.j2
    dest: "/etc/nginx/sites-available/{{ charging_domain }}"
    mode: "0644"
  vars:
    have_cert: "{{ tls_cert.stat.exists }}"
  notify: reload nginx

- name: Enable charging vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ charging_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ charging_domain }}"
    state: link
  notify: reload nginx

- name: Apply nginx changes now (needed before certbot)
  ansible.builtin.meta: flush_handlers

# Pass 2: obtain the cert (only if missing), then re-render with the TLS block.
- name: Obtain TLS cert
  when: enable_tls and not tls_cert.stat.exists
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --nginx
      - --non-interactive
      - --agree-tos
      - -m
      - "{{ certbot_email }}"
      - -d
      - "{{ charging_domain }}"
  register: certbot_run
  changed_when: "'Congratulations' in certbot_run.stdout or 'Successfully received' in certbot_run.stdout"

- name: Re-render charging vhost with TLS
  when: enable_tls
  ansible.builtin.template:
    src: charging.conf.j2
    dest: "/etc/nginx/sites-available/{{ charging_domain }}"
    mode: "0644"
  vars:
    have_cert: true
  notify: reload nginx

# ---- GoAccess traffic report (feeds the admin dashboard's Traffic tab) -------
- name: Install GoAccess
  ansible.builtin.apt:
    name: goaccess
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Report dir (read by the api container, written by the timer)
  ansible.builtin.file:
    path: /var/lib/charging-traffic
    state: directory
    mode: "0755"

- name: Render GoAccess report service
  ansible.builtin.template:
    src: goaccess-report.service.j2
    dest: /etc/systemd/system/goaccess-report.service
    mode: "0644"
  register: ga_service

- name: Render GoAccess report timer
  ansible.builtin.template:
    src: goaccess-report.timer.j2
    dest: /etc/systemd/system/goaccess-report.timer
    mode: "0644"
  register: ga_timer

- name: Reload systemd if the GoAccess units changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: ga_service is changed or ga_timer is changed

- name: Enable + start the GoAccess timer
  ansible.builtin.systemd:
    name: goaccess-report.timer
    enabled: true
    state: started

- name: Generate the first report now (ignore an empty-log failure)
  ansible.builtin.command: systemctl start goaccess-report.service
  changed_when: false
  failed_when: false
