# Production stack for a single VM. Tokens live in .env (see .env.example).
#   docker compose -f docker-compose.prod.yml up -d --build
x-app: &app
  build: .
  image: charging:latest
  env_file: .env
  environment:
    # Overrides the dev DATABASE_URL from .env to point at the compose DB.
    DATABASE_URL: postgres://charging:charging@db:5432/charging?sslmode=disable
  restart: unless-stopped

services:
  db:
    # Default is the amd64-only official image (matches prod). Local machines
    # (e.g. Apple Silicon) set DB_IMAGE to a multi-arch PostGIS 17/3.5 image —
    # see docs/local-replica.md. On the deployed host the hetz1 override replaces
    # this entirely, so prod is unaffected.
    image: ${DB_IMAGE:-postgis/postgis:17-3.5}
    # Parallel workers keep their shared tuple stores in /dev/shm, which Docker
    # caps at 64 MB. The export's full snapshot fans out over the whole charger
    # table and hit that ceiling once the dataset passed ~1M rows ("could not
    # resize shared memory segment … No space left on device", SQLSTATE 53100),
    # failing the snapshot.
    shm_size: 1gb
    environment:
      POSTGRES_USER: charging
      POSTGRES_PASSWORD: charging
      POSTGRES_DB: charging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charging -d charging"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["/usr/local/bin/migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Optional demo data (idempotent). Only runs with the "demo" profile:
  #   make prod-demo   (or: docker compose ... --profile demo up)
  demo-seed:
    image: ${DB_IMAGE:-postgis/postgis:17-3.5}
    profiles: ["demo"]
    environment:
      PGPASSWORD: charging
    entrypoint: ["sh", "-c", "psql -h db -U charging -d charging -v ON_ERROR_STOP=1 -f /seed.sql"]
    volumes:
      - ./db/demo_seed.sql:/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingest:
    <<: *app
    command: ["/usr/local/bin/ingest"]
    environment:
      DATABASE_URL: postgres://charging:charging@db:5432/charging?sslmode=disable
      METRICS_ADDR: ":9090"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # PWA served by nginx. VITE_API_BASE is injected at *runtime* (envsubst into
  # /config.js on startup) — must be the API origin the *browser* can reach (the
  # published api port, not the compose network name). Set WEB_API_BASE per env.
  web:
    build:
      context: ./web
    image: charging-web:latest
    environment:
      VITE_API_BASE: ${WEB_API_BASE:-http://localhost:8080}
      # Self-hosted vector basemap (tiles.appmire.be). Empty → raster OSM fallback.
      VITE_TILES_URL: ${TILES_URL:-}
      VITE_TILES_KEY: ${TILES_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
